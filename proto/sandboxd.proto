syntax = "proto3";

package sandboxd.v1;

service SandboxdService {
    rpc ExecStream(ExecRequest) returns (stream ExecEvent);
    rpc StartExecution(ExecRequest) returns (Execution);
    rpc GetExecution(GetExecutionRequest) returns (Execution);
    rpc CancelExecution(CancelExecutionRequest) returns (Execution);
}

message ExecRequest {
  repeated string cmd = 1;
  int32 timeout_seconds = 2;
  map<string, string> env = 3;
  string working_dir = 4;
}

message ExecExit {
  int32 exit_code = 1;
  bool timed_out = 2;
}

message ExecEvent {
  oneof payload {
    bytes stdout = 1;
    bytes stderr = 2;
    ExecExit exit = 3;
  }
}

message GetExecutionRequest { string execution_id = 1; }
message CancelExecutionRequest { string execution_id = 1; }

message Execution {
    string id = 1;
    string status = 2;
    bytes stdout = 3;
    bytes stderr = 4;
    int32 exit_code = 5;
    bool timed_out = 6;
}
